<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friluftsportalen — DataPack</title>
  <!-- STYLES -->
  <script>
    window.DATAPACK_MANIFEST = /* MANIFEST */;
  </script>
</head>
<body>
  <div id="stale-banner" class="stale-banner">
    <span id="stale-message"></span>
    <button id="btn-update" class="btn btn-primary" type="button"></button>
  </div>

  <header>
    <div class="logo">
      <!-- LOGO -->
      <span>Friluftsportalen</span>
    </div>
    <div class="header-actions">
      <div class="lang-switcher" id="lang-switcher"></div>
      <button id="btn-download" class="btn btn-green" type="button"></button>
    </div>
  </header>

  <main>
    <div id="catalog-view" class="catalog-view">
      <input type="search" id="search" class="search-bar" autocomplete="off">
      <div id="catalog-grid" class="catalog-grid"></div>
    </div>

    <div id="product-detail" class="product-detail">
      <button type="button" class="back-link" id="btn-back">←</button>
      <div class="detail-layout">
        <img id="detail-image" class="detail-image" alt="">
        <div class="detail-info">
          <p class="sku" id="detail-sku"></p>
          <h1 id="detail-name"></h1>
          <p class="price" id="detail-price"></p>
          <p class="desc" id="detail-desc"></p>
          <ul class="attributes" id="detail-attrs"></ul>
          <button id="btn-export-product" class="btn btn-primary" type="button" style="margin-top:1rem"></button>
        </div>
      </div>
    </div>
  </main>

  <div id="wizard-overlay" class="modal-overlay">
    <div class="modal export-wizard" role="dialog" aria-modal="true" aria-labelledby="wizard-title">
      <div class="modal-header">
        <div class="modal-header-text">
          <h2 id="wizard-title"></h2>
          <p id="wizard-subtitle" class="wizard-subtitle"></p>
        </div>
        <button type="button" class="modal-close" id="wizard-close" aria-label="Close">×</button>
      </div>
      <div class="wizard-stepper" id="wizard-steps"></div>
      <div class="export-wizard-body">
        <div class="export-wizard-main">
          <div id="wizard-content" class="wizard-content"></div>
        </div>
        <aside class="export-preview-panel" id="wizard-preview">
          <div class="preview-header">
            <h3 id="preview-title"></h3>
            <p id="preview-hint" class="preview-hint"></p>
          </div>
          <div class="preview-summary" id="preview-summary"></div>
          <div class="preview-content" id="preview-content"></div>
        </aside>
      </div>
      <div class="modal-footer export-wizard-footer">
        <button type="button" class="btn btn-secondary" id="wizard-back"></button>
        <button type="button" class="btn btn-primary btn-download-action" id="wizard-next"></button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
</body>
</html>
